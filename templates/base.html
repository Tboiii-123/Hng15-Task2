<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bootcamp Shop{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bootcamp Shop">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
</head>
<body>
  <header class="nav">
    <div class="container">
      <a class="logo" href="/">Bootcamp Shop</a>
      <nav class="nav-links">
        <a href="/">Shop</a>
        <a href="/cart">Cart ({{ cart_count }})</a>
        {% if user %}
          <a href="/orders">My orders</a>
          <span>{% if user.picture %}<img class="avatar" src="{{ user.picture }}" alt="" referrerpolicy="no-referrer">{% endif %}{{ user.name or user.email }}</span>
          <a href="/logout">Log out</a>
        {% else %}
          <a class="btn small" href="/login">Sign in</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function (e) {
          console.warn("Service worker registration failed", e);
        });
      });
    }
  </script>
</body>
</html>
