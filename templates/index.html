{% extends "base.html" %}
{% block content %}
<h1>Shop</h1>
<p class="sub">Pick something you like and add it to your cart.</p>
<div class="grid">
  {% for p in products %}
  <div class="card">
    {% if p.image_url %}<img src="{{ p.image_url }}" alt="{{ p.name }}" loading="lazy">{% endif %}
    <div class="body">
      <div class="name">{{ p.name }}</div>
      <div class="desc">{{ p.description }}</div>
      <div class="row">
        <span class="price">{{ p.price_cents | money }}</span>
        <form method="post" action="/cart/add/{{ p.id }}">
          <button class="btn small" type="submit">Add to cart</button>
        </form>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
